name: CI

# Windows (MSVC, VS 2022 x64) and Linux (GCC + Ninja) builds of every app,
# then the headless smokes. No GPU on the runners: TS_AUDIO=null and the
# renderers fall back to their null backends; the GL-only checks (those
# gated by TS_SMOKE_REQUIRE_GL) are skipped by leaving that variable unset.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TS_AUDIO: "null"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  windows:
    name: windows-latest / MSVC x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # No pinned generator: windows-latest images move to newer Visual
      # Studio releases, and a hard-coded "Visual Studio 17 2022" fails to
      # configure on them. CMake picks the newest VS installed (x64 MSVC).
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build (Release)
        run: cmake --build build --config Release --parallel
      - name: Smoke (server + client)
        shell: pwsh
        run: |
          Push-Location build/apps/server/Release; ./ts_server.exe --smoke; if ($LASTEXITCODE) { exit $LASTEXITCODE }; Pop-Location
          Push-Location build/apps/client/Release; ./ts_client.exe --smoke; if ($LASTEXITCODE) { exit $LASTEXITCODE }; Pop-Location
      - name: Smoke (prefab)
        working-directory: build/apps/admin/Release
        run: ./ts_admin.exe --smoke-prefab
      - name: Smoke (full ts_admin --smoke)
        working-directory: build/apps/admin/Release
        run: ./ts_admin.exe --smoke

  linux:
    name: ubuntu-latest / GCC
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Smoke (server + client)
        run: |
          (cd build/apps/server && ./ts_server --smoke)
          (cd build/apps/client && ./ts_client --smoke)
      - name: Smoke (prefab)
        working-directory: build/apps/admin
        run: ./ts_admin --smoke-prefab
      - name: Smoke (full ts_admin --smoke, under Xvfb)
        working-directory: build/apps/admin
        run: xvfb-run -a -s "-screen 0 1280x800x24" ./ts_admin --smoke
